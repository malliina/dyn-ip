name: Build and release

on: push

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04-arm

    env:
      BINARY: dynip-${{ github.ref_name }}-linux-aarch64
      CMAKE_EXE_LINKER_FLAGS: "-L${{ github.workspace }}/s2n-tls/s2n-tls-install/lib"
      CMAKE_SHARED_LINKER_FLAGS: "-L${{ github.workspace }}/s2n-tls/s2n-tls-install/lib"
      CMAKE_MODULE_LINKER_FLAGS: "-L${{ github.workspace }}/s2n-tls/s2n-tls-install/lib"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: sbt/setup-sbt@v1
      - name: Compile and Install AWS S2N-TLS
        run: |
          git clone --depth 1 https://github.com/aws/s2n-tls.git
          cd s2n-tls
          cmake . -Bbuild \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=./s2n-tls-install
          cmake --build build -j $(nproc)
          CTEST_PARALLEL_LEVEL=$(nproc) ctest --test-dir build
          cmake --install build
      - name: Test and build
        run: |
          echo "Building ${{ env.BINARY }}..."
          sbt "show nativeConfig;dynipNative/Compile/nativeLink;shutdown"
          cp target/out/native0.5/scala-3.9.0/dynip/dynip ${{ env.BINARY }}
      - name: Release packages
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            ${{ env.BINARY }}
