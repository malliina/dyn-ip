name: Build and release

on: push

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04-arm

    env:
      BINARY: dynip-${{ github.ref_name }}-linux-aarch64
      CMAKE_EXE_LINKER_FLAGS: "-L${{ github.workspace }}/s2n-tls/s2n-tls-install/lib"
      CMAKE_SHARED_LINKER_FLAGS: "-L${{ github.workspace }}/s2n-tls/s2n-tls-install/lib"
      CMAKE_MODULE_LINKER_FLAGS: "-L${{ github.workspace }}/s2n-tls/s2n-tls-install/lib"

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: sbt/setup-sbt@v1
      - name: Compile and Install AWS S2N-TLS
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build libssl-dev
          git clone --depth 1 --branch v1.7.12 https://github.com/aws/s2n-tls /tmp/s2n-tls
          cmake -S /tmp/s2n-tls -B /tmp/s2n-tls/build -G Ninja -DBUILD_SHARED_LIBS=ON -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/s2n-tls/build
          sudo cmake --install /tmp/s2n-tls/build
          sudo ldconfig
      - name: Test and build
        run: |
          echo "Building ${{ env.BINARY }}..."
          sbt "show nativeConfig;dynipNative/Compile/nativeLink;shutdown"
          cp target/out/native0.5/scala-3.9.0/dynip/dynip ${{ env.BINARY }}
      - name: Release packages
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            ${{ env.BINARY }}
